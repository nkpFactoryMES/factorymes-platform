name: Platform packages

on:
  push:
    branches:
      - main
    paths:
      - shared/**
      - build/**
      - Directory.Build.props
      - Directory.Packages.props
      - NuGet.Config
      - global.json
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - shared/**
      - build/**
      - Directory.Build.props
      - Directory.Packages.props
      - NuGet.Config
      - global.json
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build and pack exact project versions
        shell: pwsh
        run: ./build/pack.ps1
      - name: Validate package metadata
        shell: pwsh
        run: ./build/verify-packages.ps1
